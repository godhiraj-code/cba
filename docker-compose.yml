services:
  hub:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./screenshots:/app/screenshots
    environment:
      STARLIGHT_HOST: 0.0.0.0
      STARLIGHT_AUTH_TOKEN: ${STARLIGHT_AUTH_TOKEN:?Set STARLIGHT_AUTH_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  pulse:
    build: .
    command: ["python", "sentinels/pulse_sentinel.py"]
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HUB_URL: ws://hub:8080
      STARLIGHT_AUTH_TOKEN: ${STARLIGHT_AUTH_TOKEN:?Set STARLIGHT_AUTH_TOKEN}
    restart: unless-stopped

  janitor:
    build: .
    command: ["python", "sentinels/janitor.py"]
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HUB_URL: ws://hub:8080
      STARLIGHT_AUTH_TOKEN: ${STARLIGHT_AUTH_TOKEN:?Set STARLIGHT_AUTH_TOKEN}
    restart: unless-stopped

  data:
    build: .
    command: ["python", "sentinels/data_sentinel.py"]
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HUB_URL: ws://hub:8080
      STARLIGHT_AUTH_TOKEN: ${STARLIGHT_AUTH_TOKEN:?Set STARLIGHT_AUTH_TOKEN}
    restart: unless-stopped
